name: Migrate database

# Applies new files from supabase/migrations to the `docspread-dev` project after a merge to main.
# Vercel deploys the app itself. Secrets live in the GitHub environment `dev`, never in the repo.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-dev
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Session pooler of docspread-dev (Supabase dashboard > Connect > Session pooler). Not a secret.
      # GitHub runners have no IPv6, so the direct db.<ref>.supabase.co host can't be used.
      SUPABASE_POOLER_HOST: aws-1-eu-west-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      # No `supabase link`: it needs a Management API token with many scopes. db push talks to the database directly.
      - name: Push migrations
        run: |
          PW=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$PW"
          supabase db push --db-url "postgresql://postgres.${SUPABASE_PROJECT_REF}:${PW}@${SUPABASE_POOLER_HOST}:5432/postgres"
