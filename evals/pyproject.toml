[project]
name = "docspread-evals"
version = "0.1.0"
description = "Golden dataset and extraction evals for DocSpread"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.63.0",
    "pillow>=13.0.0",
    "pydantic>=2",
    "pypdf>=7.1.1",
    "reportlab>=5.1.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
