[project]
name = "docspread-evals"
version = "0.1.0"
description = "Golden dataset and extraction evals for DocSpread"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
